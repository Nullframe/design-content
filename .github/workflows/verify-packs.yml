# Checks every published pack archive (packs/*/pack.json) the way a user without GitHub access gets it: downloaded
# anonymously from its release URL, then its SHA-256 and size, its MANIFEST.json and its licence files
# (scripts/verify_packs.py).
#
# - Pull request or push to main touching packs/, scripts/ or this workflow: check.
# - Weekly and by hand (Actions → verify-packs → Run workflow): check, so a deleted or replaced asset shows up.
#
# Archives live only in releases; the repository holds the manifests, notices and this check.
name: verify-packs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: ["packs/**", "scripts/**", ".github/workflows/verify-packs.yml"]
  pull_request:
    paths: ["packs/**", "scripts/**", ".github/workflows/verify-packs.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every published archive (anonymous download)
        run: python3 scripts/verify_packs.py
